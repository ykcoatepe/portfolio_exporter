groups:
  - name: psd
    rules:
      - alert: NoEvents
        expr: rate(psd_stream_events_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PSD stream stopped emitting events"
          description: |
            No Server-Sent Events were emitted in the last 5 minutes.
            Check psd-web and psd-ingestor processes.
      - alert: StaleData
        expr: psd_data_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PSD data is stale"
          description: |
            Dashboard data has been older than 60 seconds for 2 minutes.
            Verify ingestion and upstream data sources.
      - alert: IngestSlow
        expr: histogram_quantile(0.95, sum(rate(psd_ingest_tick_seconds_bucket[5m])) by (le)) > 1.5
        labels:
          severity: warning
        annotations:
          summary: "PSD ingestion is running slow"
          description: |
            The 95th percentile ingest tick duration exceeded 1.5 seconds.
            Investigate load, network, or upstream data latency.
      - alert: MSBStaleWarning
        expr: psd_msb_data_age_seconds > 115200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "MSB reading is stale (>1 trading day)"
          description: |
            psd_msb_data_age_seconds is over 32 hours. Check MSB vendor refresh
            (IBKR/FRED/YF), run `make msb-refresh-now`, and inspect /msb/status detail.
      - alert: MSBStaleCritical
        expr: psd_msb_data_age_seconds > 172800
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "MSB reading critically stale (>2 days)"
          description: |
            psd_msb_data_age_seconds is over 48 hours. MSB risk signals may be invalid.
            Refresh MSB data and verify vendor CSVs and scheduler logs.
