name: PSD CI

on:
  pull_request:
    branches: [ main, PSD, integrate, "feature/**" ]
  push:
    branches: [ PSD ]
    tags: ["v*", "psd-*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # cancel older runs on same branch

jobs:
  python:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy portfolio_exporter src
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Build SPA assets
        run: make web-build
      - name: Web unit tests
        run: make web-test
      - name: Pytest (full suite with PE_TEST_MODE=1)
        run: pytest -q
        env:
          PE_TEST_MODE: "1"
          PE_QUIET: "1"
          MOMO_OFFLINE: "1"
      - name: Micro-MOMO CLI (json-only)
        run: |
          set -euo pipefail
          out=$(python -m apps.cli.run --analyzer micro_momo_analyzer --json-only --out out/micro_momo --scan-csv tests/data/meme_scan_sample.csv --chains-dir tests/data --cfg-json tests/data/micro_momo_config.json)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | python - <<'PY'
import json
import sys

payload = json.load(sys.stdin)
if not isinstance(payload, dict):
    raise SystemExit("Micro-MOMO payload is not a JSON object")

for key in ("signals", "artifacts"):
    if key not in payload:
        raise SystemExit(f"missing {key} from Micro-MOMO CLI output")

signals = payload.get("signals")
if not isinstance(signals, list) or not signals:
    raise SystemExit("Micro-MOMO produced no signals list")
for idx, signal in enumerate(signals):
    if not isinstance(signal, dict):
        raise SystemExit(f"signal[{idx}] is not a JSON object")
    for required in ("name", "score", "value"):
        if required not in signal:
            raise SystemExit(f"signal[{idx}] missing '{required}' field")

candidates = payload.get("candidates")
summary = payload.get("summary")
if candidates is None and isinstance(summary, dict):
    candidates = summary.get("candidates")

notes = payload.get("notes")
if candidates is None and isinstance(notes, dict):
    note_summary = notes.get("summary")
    if isinstance(note_summary, dict):
        candidates = note_summary.get("candidates")

if candidates is None:
    raise SystemExit("missing candidates from Micro-MOMO CLI output")
if not isinstance(candidates, list) or not candidates:
    raise SystemExit("Micro-MOMO candidates payload is empty or not a list")

if isinstance(summary, dict) and summary.get("candidates"):
    for idx, candidate in enumerate(summary["candidates"]):
        if not isinstance(candidate, dict):
            raise SystemExit(f"summary.candidates[{idx}] is not a JSON object")
        for required in ("symbol", "direction", "score"):
            if required not in candidate:
                raise SystemExit(f"summary.candidates[{idx}] missing '{required}'")

print("adapter-smoke: OK")
PY
        env:
          MOMO_OFFLINE: "1"
          PE_QUIET: "1"
      - name: Micro-MOMO CLI (full-artifacts)
        if: startsWith(github.ref, 'refs/tags/')
        run: python -m apps.cli.run --analyzer micro_momo_analyzer --no-json-only --full-artifacts --out out/micro_momo --scan-csv tests/data/meme_scan_sample.csv --chains-dir tests/data --cfg-json tests/data/micro_momo_config.json
      - name: Upload Micro-MOMO artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        # Retention is capped by org/repo policy; 14 days keeps tag archives tidy locally.
        with:
          name: micro-momo-artifacts
          path: out/micro_momo/**
          retention-days: 14

  ingest-internal:
    name: Internal Ingest
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Pytest internal provider precedence
        run: pytest -q tests/test_ingest_internal.py::test_internal_provider_precedence
        env:
          PE_QUIET: "1"
          MOMO_OFFLINE: "1"

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python env for exporting OpenAPI JSON (FastAPI auto-generates the schema)
      # https://docs.github.com/actions  |  setup-python cache docs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'                               # built-in pip cache
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install fastapi "uvicorn[standard]" # minimal deps to import the app

      - name: Export OpenAPI JSON (offline, no server)
        run: |
          python - <<'PY'
          from apps.api.main import app
          import json, sys
          sys.stdout.write(json.dumps(app.openapi()))
          PY > apps/web/openapi.json
      # Now generate TypeScript types from the local file
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                               # built-in npm cache
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate TS types
        working-directory: apps/web
        run: npx --yes openapi-typescript ./openapi.json -o src/lib/api.d.ts  # CLI supports local/remote

      - name: Ensure types are up-to-date
        run: git diff --exit-code -- apps/web/src/lib/api.d.ts

  unit:
    name: Unit
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:unit -- --run

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:contracts -- --run
      - name: Upload pact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: apps/web/pacts/**/*.json
          retention-days: 14

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Run Playwright smoke test
        run: make web-e2e
