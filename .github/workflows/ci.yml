name: CI

on:
  workflow_dispatch: {}
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Build SPA assets
        run: make web-build
      - name: Web unit tests
        run: make web-test
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Memory validate & digest
        run: |
          python -m portfolio_exporter.scripts.memory validate
          python -m portfolio_exporter.scripts.memory digest | tee memory_digest.txt
      - name: Upload memory digest
        uses: actions/upload-artifact@v4
        with:
          name: memory-digest
          path: memory_digest.txt
      - name: Security (optional)
        run: |
          pip install pip-audit
          pip-audit || true
