[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["legacy/**", "tests/**", "local_backup/**", "run/**"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio_exporter"
version = "0.1.1"
description = "Personal trading utilities: combos, greeks, roll wizard, live quotes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yordam Kocatepe" }]

dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "yfinance>=0.2.37",
  "rich>=13.3",
  "pydantic-settings>=2.0",
  "dateparser>=1.2.0",
  "pandas-datareader>=0.10",
]

[project.optional-dependencies]
ib = ["ib_insync>=0.9.86"]
pdf = ["reportlab>=4.0"]
psd = [
  "fastapi>=0.110",
  "uvicorn>=0.22",
  "pydantic>=2.7",
  "websockets>=12.0",
  "wsproto>=1.2"
]

[project.scripts]
portfolio_playbook = "main:main"
daily-report = "portfolio_exporter.scripts.daily_report:main"
netliq-export = "portfolio_exporter.scripts.net_liq_history_export:main"
quick-chain = "portfolio_exporter.scripts.quick_chain:main"
trades-report = "portfolio_exporter.scripts.trades_report:main"
trades-dashboard = "portfolio_exporter.scripts.trades_dashboard:main"
portfolio-greeks = "portfolio_exporter.scripts.portfolio_greeks:main"
doctor = "portfolio_exporter.scripts.doctor:main"
validate-json = "portfolio_exporter.scripts.validate_json:main"
combo-db-maint = "portfolio_exporter.scripts.combo_db_maint:main"
order-builder = "portfolio_exporter.scripts.order_builder:main"
micro-momo = "portfolio_exporter.scripts.micro_momo_analyzer:main"

[tool.setuptools.packages.find]
include = ["portfolio_exporter*"]
exclude = ["legacy*", "tests*", "utils*", "docs*", "ibkr_env*", "iv_history*"]

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.data-files]
"schemas" = ["schemas/*.json"]

[tool.setuptools.package-data]
"portfolio_exporter" = ["assets/*.css"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "(^|/)(\\.venv|ibkr_env|legacy|local_backup|run|dist|tmp|var)/"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E203", "E501", "E402", "UP038", "B007", "B023", "B904"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
disable_error_code = ["import-not-found", "import-untyped"]
follow_imports = "skip"
files = [
  "portfolio_exporter/core/date_utils.py",
  "portfolio_exporter/core/ib_config.py",
  "portfolio_exporter/core/input.py",
  "portfolio_exporter/core/runlog.py",
  "portfolio_exporter/core/schemas.py",
]
exclude = "(^|/)(apps|dist|legacy|libs|local_backup|psd|run|scripts|src|tests|tools|utils)/|(^|/)main\\.py$|(^|/)market_analyzer\\.py$|(^|/)portfolio_exporter/(menus|scripts)/|(^|/)portfolio_exporter/(main\\.py|psd_adapter\\.py)$|(^|/)portfolio_exporter/core/(?!date_utils\\.py$|ib_config\\.py$|input\\.py$|runlog\\.py$|schemas\\.py$).*"
